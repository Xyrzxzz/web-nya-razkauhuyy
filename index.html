<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Asisten Modern</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --primary: #2563eb;
            --bg-color: #f3f4f6;
            --chat-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --user-bubble: #2563eb;
            --ai-bubble: #f3f4f6;
            --sidebar-bg: #111827;
            --sidebar-text: #f9fafb;
            --header-bg: rgba(255, 255, 255, 0.9);
            --border-color: #e5e7eb;
        }

        body.dark-theme {
            --bg-color: #0b0f19;
            --chat-bg: #111827;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --user-bubble: #2563eb;
            --ai-bubble: #1f2937;
            --sidebar-bg: #030712;
            --sidebar-text: #f3f4f6;
            --header-bg: rgba(17, 24, 39, 0.9);
            --border-color: #374151;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            position: fixed;
            top: 0;
            left: 0;
        }

        body { 
            display: flex; 
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- SIDEBAR MENU --- */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            height: 100%;
            z-index: 100;
            transform: translateX(-100%);
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #374151; }
        .profile-section { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .avatar { width: 50px; height: 50px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: white; }
        .name-wrapper { flex: 1; }
        #userNameDisplay { font-weight: 600; font-size: 16px; margin-bottom: 3px; }
        .edit-name-btn { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px;}
        
        .info-section { padding: 20px; font-size: 12px; color: #9ca3af; flex: 1; overflow-y: auto;}
        .info-item { margin-bottom: 10px; display: flex; align-items: center; gap: 8px;}
        
        .settings-section { padding: 20px; border-top: 1px solid #374151; background-color: var(--sidebar-bg); }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px;}
        select { background: #374151; color: white; border: none; padding: 6px 10px; border-radius: 6px; outline: none; cursor: pointer;}
        
        .clear-chat-btn { width: 100%; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; display: flex; justify-content: center; align-items: center; gap: 8px;}

        /* Overlay gelap saat sidebar buka di HP */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 90; display: none;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .overlay.show { display: block; opacity: 1; }

        /* --- MAIN CHAT AREA --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: var(--chat-bg);
            position: relative;
            transition: background-color 0.3s ease;
        }

        .header {
            padding: 15px 20px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
            font-size: 18px;
            height: 60px;
            flex-shrink: 0;
            color: var(--text-main);
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        .menu-btn { background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; padding: 10px; display: block; z-index: 10; }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--chat-bg);
            -webkit-overflow-scrolling: touch;
            transition: background-color 0.3s ease;
        }

        /* Tampilan Layar Kosong (Hero) */
        .welcome-hero {
            margin: auto;
            text-align: center;
            padding: 20px;
            animation: fadeIn 0.8s ease;
            max-width: 90%;
        }
        .hero-icon { font-size: 50px; margin-bottom: 15px; background: -webkit-linear-gradient(#3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        .hero-title { font-size: 22px; font-weight: 600; margin-bottom: 10px; line-height: 1.3; }
        .hero-subtitle { color: var(--text-muted); font-size: 14px; max-width: 320px; margin: 0 auto; line-height: 1.4; }

        /* Balon Chat */
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: slideUp 0.3s ease;
        }
        .user-msg {
            background-color: var(--user-bubble);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-msg {
            background-color: var(--ai-bubble);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Indikator Berpikir (Typing) */
        .typing-indicator {
            display: flex; gap: 5px; padding: 15px 20px; align-self: flex-start;
            background-color: var(--ai-bubble); border-radius: 18px; border-bottom-left-radius: 4px;
            margin-top: 5px;
            transition: background-color 0.3s ease;
        }
        .dot { width: 8px; height: 8px; background-color: #9ca3af; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* Area Input */
        .input-wrapper {
            padding: 12px 15px;
            background: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            height: 70px;
            flex-shrink: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .input-box {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 12px 20px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            height: 46px;
            color: var(--text-main);
        }
        .input-box:focus { border-color: var(--primary); background: var(--chat-bg); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .send-btn:active { transform: scale(0.9); }

        /* Animasi */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Media Query Desktop & Orientasi Layar */
        @media (min-width: 768px) {
            .sidebar { transform: translateX(0); position: relative; }
            .overlay { display: none !important; }
            .menu-btn { display: none; }
            .message { max-width: 70%; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="profile-section">
                <div class="avatar" id="avatarInitial">G</div>
                <div class="name-wrapper">
                    <div id="userNameDisplay">Guest</div>
                    <button class="edit-name-btn" onclick="editName()"><i class="fas fa-pen"></i> Edit Nama</button>
                </div>
            </div>
        </div>
        
        <div class="info-section">
            <div class="info-item"><i class="fas fa-clock"></i> <span id="currentTime"></span></div>
            <div class="info-item"><i class="fas fa-history"></i> Terakhir buka: <span id="lastOpened">Baru saja</span></div>
            <br>
            <p style="color: #6b7280; font-weight: bold; margin-bottom: 10px;">Status Sistem</p>
            <div class="info-item" style="color: #4ade80;"><i class="fas fa-check-circle"></i> AI Siap Digunakan</div>
            <div class="info-item" style="color: #4ade80;"><i class="fas fa-check-circle"></i> Memori Aktif</div>
        </div>

        <div class="settings-section">
            <div class="setting-row">
                <span><i class="fas fa-palette"></i> Tema</span>
                <select id="themeSelect" onchange="changeTheme()">
                    <option value="light">Terang</option>
                    <option value="dark">Gelap</option>
                </select>
            </div>
            <div class="setting-row">
                <span><i class="fas fa-globe"></i> Bahasa UI</span>
                <select id="langSelect" onchange="changeLanguage()">
                    <option value="id">Indonesia</option>
                    <option value="en">English</option>
                </select>
            </div>
            <button class="clear-chat-btn" onclick="clearHistory()"><i class="fas fa-trash"></i> Hapus Obrolan</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <span id="headerTitle">AI Asistenku</span>
        </div>

        <div class="chat-container" id="chatBox">
            </div>

        <div class="input-wrapper">
            <input type="text" class="input-box" id="userInput" placeholder="Ketik pesanmu di sini..." onkeypress="cekEnter(event)">
            <button class="send-btn" onclick="kirimPesan()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyCrmd3oe9_U1_mcb_N5RpQSrFuJibwL6Js"; 
        
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        
        let chatHistoryData = [];

        const uiText = {
            id: {
                heroTitle: "Mau Cerita, Bertanya, Apapun Hari Ini!",
                heroSub: "Saya siap mendengarkan dengan penuh perhatian dan memberikan solusi terbaik untukmu sahabat.",
                placeholder: "Ketik pesanmu di sini...",
                header: "AI Asistenku"
            },
            en: {
                heroTitle: "Let's Talk or Ask Anything Today!",
                heroSub: "I'm ready to listen closely and provide the absolute best solutions for you, my friend.",
                placeholder: "Type your message here...",
                header: "My AI Assistant"
            }
        };

        window.onload = () => {
            loadUserData();
            updateTime();
            setInterval(updateTime, 60000);
            loadChatHistory();
            window.addEventListener('resize', scrollToBottom);
        };

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const dateString = now.toLocaleDateString();
            document.getElementById('currentTime').innerText = `${dateString} - ${timeString}`;
        }

        function loadUserData() {
            // Load Nama
            let nama = localStorage.getItem('ai_userName') || 'Guest';
            document.getElementById('userNameDisplay').innerText = nama;
            document.getElementById('avatarInitial').innerText = nama.charAt(0).toUpperCase();

            // Load Histori Waktu Akses
            let lastOpen = localStorage.getItem('ai_lastOpened');
            if(lastOpen) {
                document.getElementById('lastOpened').innerText = lastOpen;
            }
            const now = new Date();
            localStorage.setItem('ai_lastOpened', now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));

            // Load Tema
            let savedTheme = localStorage.getItem('ai_theme') || 'light';
            document.getElementById('themeSelect').value = savedTheme;
            applyTheme(savedTheme);

            // Load Bahasa
            let lang = localStorage.getItem('ai_lang') || 'id';
            document.getElementById('langSelect').value = lang;
            applyLanguage(lang);
        }

        function editName() {
            let currentName = localStorage.getItem('ai_userName') || 'Guest';
            let newName = prompt("Masukkan nama panggilanmu:", currentName);
            if (newName && newName.trim() !== "") {
                localStorage.setItem('ai_userName', newName.trim());
                loadUserData();
            }
        }

        function changeTheme() {
            let selectedTheme = document.getElementById('themeSelect').value;
            localStorage.setItem('ai_theme', selectedTheme);
            applyTheme(selectedTheme);
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.remove('dark-theme');
            }
        }

        function changeLanguage() {
            let selectedLang = document.getElementById('langSelect').value;
            localStorage.setItem('ai_lang', selectedLang);
            applyLanguage(selectedLang);
        }

        function applyLanguage(lang) {
            userInput.placeholder = uiText[lang].placeholder;
            document.getElementById('headerTitle').innerText = uiText[lang].header;
            
            if (chatHistoryData.length === 0) {
                renderHero(lang);
            }
        }

        function renderHero(lang) {
            chatBox.innerHTML = `
                <div class="welcome-hero" id="welcomeHero">
                    <i class="fas fa-wand-magic-sparkles hero-icon"></i>
                    <h2 class="hero-title">${uiText[lang].heroTitle}</h2>
                    <p class="hero-subtitle">${uiText[lang].heroSub}</p>
                </div>
            `;
        }

        function loadChatHistory() {
            let savedChat = localStorage.getItem('ai_chatHistory');
            if (savedChat) {
                chatHistoryData = JSON.parse(savedChat);
                if (chatHistoryData.length > 0) {
                    chatBox.innerHTML = '';
                    chatHistoryData.forEach(msg => {
                        let div = document.createElement('div');
                        div.className = `message ${msg.role === 'user' ? 'user-msg' : 'ai-msg'}`;
                        div.innerText = msg.text;
                        chatBox.appendChild(div);
                    });
                    scrollToBottom();
                } else {
                    let lang = localStorage.getItem('ai_lang') || 'id';
                    renderHero(lang);
                }
            } else {
                let lang = localStorage.getItem('ai_lang') || 'id';
                renderHero(lang);
            }
        }

        function clearHistory() {
            if(confirm("Yakin ingin menghapus semua memori obrolan?")) {
                localStorage.removeItem('ai_chatHistory');
                chatHistoryData = [];
                let lang = localStorage.getItem('ai_lang') || 'id';
                renderHero(lang);
                if(window.innerWidth < 768) toggleSidebar();
            }
        }

        function cekEnter(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                kirimPesan();
            }
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 50);
        }

        async function kirimPesan() {
            const pesanText = userInput.value.trim();
            if (!pesanText) return;

            const hero = document.getElementById('welcomeHero');
            if (hero) hero.remove();

            appendMessage(pesanText, 'user');
            userInput.value = '';
            
            chatHistoryData.push({ role: "user", text: pesanText });
            localStorage.setItem('ai_chatHistory', JSON.stringify(chatHistoryData));

            const typingId = 'typing-' + Date.now();
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = typingId;
            typingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            chatBox.appendChild(typingDiv);
            scrollToBottom();

            let apiContents = chatHistoryData.map(msg => ({
                role: msg.role === 'user' ? 'user' : 'model',
                parts: [{ text: msg.text }]
            }));

            let userName = localStorage.getItem('ai_userName') || 'Teman';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ 
                                text: `Kamu adalah asisten AI yang sangat pintar, ramah, hangat, dan penuh empati. Namamu adalah AI Asisten. Nama pengguna yang sedang mengobrol denganmu adalah "${userName}". Jawablah pertanyaannya dengan cara yang paling membantu, suportif, dan senatural mungkin layaknya sahabat yang cerdas. Gunakan bahasa yang sesuai dengan yang digunakan pengguna.`
                            }]
                        },
                        contents: apiContents
                    })
                });

                const data = await response.json();
                
                const elementTyping = document.getElementById(typingId);
                if(elementTyping) elementTyping.remove();

                if(data.error) {
                    throw new Error(data.error.message);
                }

                const jawabanAI = data.candidates[0].content.parts[0].text;
                appendMessage(jawabanAI, 'ai');
                
                chatHistoryData.push({ role: "model", text: jawabanAI });
                localStorage.setItem('ai_chatHistory', JSON.stringify(chatHistoryData));

            } catch (error) {
                const elementTyping = document.getElementById(typingId);
                if(elementTyping) elementTyping.remove();
                appendMessage("Gagal terhubung ke AI. Silakan periksa kembali konfigurasi atau koneksi internet.", 'ai');
                console.error(error);
            }
        }

        function appendMessage(text, sender) {
            let div = document.createElement('div');
            div.className = `message ${sender === 'user' ? 'user-msg' : 'ai-msg'}`;
            div.innerHTML = text.replace(/\n/g, '<br>');
            chatBox.appendChild(div);
            scrollToBottom();
        }
    </script>
</body>
</html>
