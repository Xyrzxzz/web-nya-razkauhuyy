<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot AI Saya</title>
    <style>
        /* Mengatur dasar halaman web agar pas di layar HP */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f7f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
        }

        /* Wadah utama Chat yang responsif di HP */
        .chat-container { 
            width: 100%; 
            max-width: 450px; 
            height: 100vh; 
            background: #ffffff; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        @media (min-width: 450px) {
            .chat-container { height: 90vh; border-radius: 15px; }
        }

        /* Bagian Atas / Header Web AI */
        .chat-header { 
            background: #0078ff; 
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 18px; 
            border-top-left-radius: inherit; 
            border-top-right-radius: inherit;
        }

        /* Area tempat pesan muncul */
        .chat-box { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background: #f0f2f5;
        }

        /* Gaya balon balon chat */
        .msg { 
            padding: 10px 14px; 
            border-radius: 18px; 
            max-width: 80%; 
            font-size: 15px; 
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user { 
            background: #0078ff; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px;
        }
        .ai { 
            background: white; 
            color: #333; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* Area bawah tempat mengetik */
        .input-area { 
            padding: 10px; 
            background: white; 
            display: flex; 
            gap: 8px; 
            border-top: 1px solid #e6e6e6;
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #e6e6e6; 
            border-radius: 25px; 
            outline: none; 
            font-size: 15px;
            background: #f7f9fa;
        }
        input:focus { border-color: #0078ff; background: white; }
        button { 
            background: #0078ff; 
            color: white; 
            border: none; 
            padding: 0 20px; 
            border-radius: 25px; 
            font-weight: bold; 
            cursor: pointer;
            font-size: 15px;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 AI Asistenku</div>
    <div class="chat-box" id="chatBox">
        <div class="msg ai">Halo! Saya adalah AI buatanmu yang ditenagai Gemini. Ada yang bisa saya bantu hari ini?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Tanyakan sesuatu ke AI..." onkeypress="cekEnter(event)">
        <button onclick="kirimPesan()">Kirim</button>
    </div>
</div>

<script>
    // === MODIFIKASI BAGIAN INI ===
    // Ganti teks di bawah dengan API KEY yang kamu dapat dari Langkah 1
    const API_KEY = "AIzaSyChDpzP_0sIlYIGuyH2A4cDm_1S-ks-nXQ"; 

    // Fungsi agar bisa mengirim pesan dengan menekan tombol 'Enter' di keyboard HP
    function cekEnter(event) {
        if (event.key === "Enter") {
            kirimPesan();
        }
    }

    async function kirimPesan() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const pesanUser = input.value.trim();
        
        // Jika input kosong, batalkan pengiriman
        if (!pesanUser) return;

        // 1. Tampilkan pesan user ke layar chat
        chatBox.innerHTML += `<div class="msg user">${pesanUser}</div>`;
        input.value = ''; // Kosongkan kolom input
        chatBox.scrollTop = chatBox.scrollHeight; // Geser scroll otomatis ke bawah

        // 2. Buat elemen loading sementara selagi AI berpikir
        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div class="msg ai" id="${loadingId}"><i>Sedang mengetik...</i></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // 3. Menghubungkan ke server Google Gemini menggunakan JavaScript (Fetch API)
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: pesanUser }] }] })
            });

            // 4. Membaca data kiriman dari Google
            const data = await response.json();
            
            // Mengambil teks jawaban utama dari struktur data Google Gemini
            const jawabanAI = data.candidates[0].content.parts[0].text;
            
            // 5. Ganti teks "Sedang mengetik..." dengan jawaban asli dari AI
            document.getElementById(loadingId).innerText = jawabanAI;

        } catch (error) {
            // Jika ada masalah (salah API Key, kuota habis, atau internet putus)
            document.getElementById(loadingId).innerHTML = "<span style='color: red;'>Waduh, gagal terhubung ke AI. Pastikan API Key kamu benar atau periksa koneksi internet.</span>";
            console.error(error);
        }
        
        // Geser kembali scroll ke bawah setelah jawaban muncul
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
  </html>
