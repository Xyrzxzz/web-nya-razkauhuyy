<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Asisten Modern</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --primary: #2563eb;
            --bg-color: #f3f4f6;
            --chat-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --user-bubble: #2563eb;
            --ai-bubble: #f3f4f6;
            --sidebar-bg: #111827;
            --sidebar-text: #f9fafb;
            --header-bg: rgba(255, 255, 255, 0.9);
            --border-color: #e5e7eb;
            --msg-time: #9ca3af;
        }

        body.dark-theme {
            --bg-color: #0b0f19;
            --chat-bg: #111827;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --user-bubble: #2563eb;
            --ai-bubble: #1f2937;
            --sidebar-bg: #030712;
            --sidebar-text: #f3f4f6;
            --header-bg: rgba(17, 24, 39, 0.9);
            --border-color: #374151;
            --msg-time: #6b7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            position: fixed;
            top: 0;
            left: 0;
        }

        body { 
            display: flex; 
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- SIDEBAR MENU --- */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            height: 100%;
            z-index: 100;
            transform: translateX(-100%);
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #374151; }
        .profile-section { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .avatar { width: 45px; height: 45px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: white; }
        .name-wrapper { flex: 1; }
        #userNameDisplay { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
        .edit-name-btn { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 4px;}
        
        /* List Tabel Riwayat Chat */
        .history-section {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .history-title-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: #6b7280;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .history-item {
            width: 100%;
            background: #1f2937;
            border: none;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        .sidebar-dark-theme .history-item { background: #111827; }
        .history-item:hover, .history-item.active { background: #374151; }
        .history-text-wrapper {
            flex: 1;
            overflow: hidden;
            padding-right: 8px;
        }
        .history-item-title {
            font-size: 13px;
            color: #f3f4f6;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item-time {
            font-size: 10px;
            color: #9ca3af;
            margin-top: 2px;
        }
        .delete-history-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 4px;
            font-size: 12px;
            transition: color 0.2s;
        }
        .delete-history-btn:hover { color: #ef4444; }

        .new-chat-sidebar-btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .settings-section { padding: 15px; border-top: 1px solid #374151; background-color: var(--sidebar-bg); }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px;}
        select { background: #374151; color: white; border: none; padding: 4px 8px; border-radius: 5px; outline: none; cursor: pointer; font-size: 12px;}
        
        .footer-credit {
            text-align: center;
            font-size: 11px;
            color: #4b5563;
            padding-top: 10px;
            border-top: 1px solid #374151;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Overlay gelap saat sidebar buka di HP */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 90; display: none;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .overlay.show { display: block; opacity: 1; }

        /* --- MAIN CHAT AREA --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: var(--chat-bg);
            position: relative;
            transition: background-color 0.3s ease;
        }

        .header {
            padding: 15px 20px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
            font-size: 18px;
            height: 60px;
            flex-shrink: 0;
            color: var(--text-main);
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        .menu-btn { background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; padding: 10px; display: block; z-index: 10; }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: var(--chat-bg);
            -webkit-overflow-scrolling: touch;
            transition: background-color 0.3s ease;
        }

        /* Pembatas Tanggal Hari */
        .day-separator {
            text-align: center;
            margin: 10px 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .day-separator span {
            background: var(--bg-color);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* Tampilan Layar Kosong (Hero) */
        .welcome-hero {
            margin: auto;
            text-align: center;
            padding: 20px;
            animation: fadeIn 0.8s ease;
            max-width: 90%;
        }
        .hero-icon { font-size: 50px; margin-bottom: 15px; background: -webkit-linear-gradient(#3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        .hero-title { font-size: 22px; font-weight: 600; margin-bottom: 10px; line-height: 1.3; }
        .hero-subtitle { color: var(--text-muted); font-size: 14px; max-width: 320px; margin: 0 auto; line-height: 1.4; }

        /* Struktur Balon Chat Grouping */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            position: relative;
        }
        .message-wrapper.user-wrap { align-self: flex-end; align-items: flex-end; }
        .message-wrapper.ai-wrap { align-self: flex-start; align-items: flex-start; }

        /* Balon Chat */
        .message {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: slideUp 0.3s ease;
            position: relative;
        }
        .user-msg {
            background-color: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai-msg {
            background-color: var(--ai-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Waktu Pengiriman Pesan (Jam) */
        .msg-timestamp {
            font-size: 10px;
            color: var(--msg-time);
            margin-top: 4px;
            padding: 0 4px;
        }

        /* Menu Aksi Pesan (Salin/Hapus) */
        .msg-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .message-wrapper:hover .msg-actions { opacity: 1; }
        /* Selalu muncul di device sentuh/mobile */
        @media (max-width: 768px) { .msg-actions { opacity: 0.7; } }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 4px;
        }
        .action-btn:hover { color: var(--primary); }
        .action-btn.del-msg-btn:hover { color: #ef4444; }

        /* Indikator Berpikir (Typing) */
        .typing-indicator {
            display: flex; gap: 5px; padding: 15px 20px; align-self: flex-start;
            background-color: var(--ai-bubble); border-radius: 18px; border-bottom-left-radius: 4px;
            margin-top: 5px;
            transition: background-color 0.3s ease;
        }
        .dot { width: 8px; height: 8px; background-color: #9ca3af; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* Area Input */
        .input-wrapper {
            padding: 12px 15px;
            background: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            height: 70px;
            flex-shrink: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .input-box {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 12px 20px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            height: 46px;
            color: var(--text-main);
        }
        .input-box:focus { border-color: var(--primary); background: var(--chat-bg); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .send-btn:active { transform: scale(0.9); }

        /* Animasi */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Media Query Desktop */
        @media (min-width: 768px) {
            .sidebar { transform: translateX(0); position: relative; }
            .overlay { display: none !important; }
            .menu-btn { display: none; }
            .message-wrapper { max-width: 70%; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="profile-section">
                <div class="avatar" id="avatarInitial">G</div>
                <div class="name-wrapper">
                    <div id="userNameDisplay">Guest</div>
                    <button class="edit-name-btn" onclick="editName()"><i class="fas fa-pen"></i> Edit Nama</button>
                </div>
            </div>
        </div>
        
        <div class="history-section">
            <button class="new-chat-sidebar-btn" onclick="startNewChatSession()"><i class="fas fa-plus"></i> Obrolan Baru</button>
            <div class="history-title-label">Riwayat Obrolan</div>
            <div class="history-list" id="historyContainerList">
                </div>
        </div>

        <div class="settings-section">
            <div class="setting-row">
                <span><i class="fas fa-palette"></i> Tema</span>
                <select id="themeSelect" onchange="changeTheme()">
                    <option value="light">Terang</option>
                    <option value="dark">Gelap</option>
                </select>
            </div>
            <div class="setting-row">
                <span><i class="fas fa-globe"></i> Bahasa UI</span>
                <select id="langSelect" onchange="changeLanguage()">
                    <option value="id">Indonesia</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="footer-credit">
                MADE BY RAZKAUHUYY
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <span id="headerTitle">AI Asistenku</span>
        </div>

        <div class="chat-container" id="chatBox">
            </div>

        <div class="input-wrapper">
            <input type="text" class="input-box" id="userInput" placeholder="Ketik pesanmu di sini..." onkeypress="cekEnter(event)">
            <button class="send-btn" onclick="kirimPesan()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyCrmd3oe9_U1_mcb_N5RpQSrFuJibwL6Js"; 
        
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const historyContainerList = document.getElementById('historyContainerList');
        
        // Struktur Data Multi Sesi Obrolan
        let allSessions = {};
        let currentSessionId = "";

        const uiText = {
            id: {
                heroTitle: "Mau Cerita, Bertanya, Apapun Hari Ini!",
                heroSub: "Saya siap mendengarkan dengan penuh perhatian dan memberikan solusi terbaik untukmu sahabat.",
                placeholder: "Ketik pesanmu di sini...",
                header: "AI Asistenku"
            },
            en: {
                heroTitle: "Let's Talk or Ask Anything Today!",
                heroSub: "I'm ready to listen closely and provide the absolute best solutions for you, my friend.",
                placeholder: "Type your message here...",
                header: "My AI Assistant"
            }
        };

        window.onload = () => {
            loadUserData();
            loadAllSessions();
            window.addEventListener('resize', scrollToBottom);
        };

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        function loadUserData() {
            let nama = localStorage.getItem('ai_userName') || 'Guest';
            document.getElementById('userNameDisplay').innerText = nama;
            document.getElementById('avatarInitial').innerText = nama.charAt(0).toUpperCase();

            let savedTheme = localStorage.getItem('ai_theme') || 'light';
            document.getElementById('themeSelect').value = savedTheme;
            applyTheme(savedTheme);

            let lang = localStorage.getItem('ai_lang') || 'id';
            document.getElementById('langSelect').value = lang;
            applyLanguage(lang);
        }

        function editName() {
            let currentName = localStorage.getItem('ai_userName') || 'Guest';
            let newName = prompt("Masukkan nama panggilanmu:", currentName);
            if (newName && newName.trim() !== "") {
                localStorage.setItem('ai_userName', newName.trim());
                loadUserData();
            }
        }

        function changeTheme() {
            let selectedTheme = document.getElementById('themeSelect').value;
            localStorage.setItem('ai_theme', selectedTheme);
            applyTheme(selectedTheme);
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.remove('dark-theme');
            }
        }

        function changeLanguage() {
            let selectedLang = document.getElementById('langSelect').value;
            localStorage.setItem('ai_lang', selectedLang);
            applyLanguage(selectedLang);
        }

        function applyLanguage(lang) {
            userInput.placeholder = uiText[lang].placeholder;
            document.getElementById('headerTitle').innerText = uiText[lang].header;
            
            if (!currentSessionId || !allSessions[currentSessionId] || allSessions[currentSessionId].messages.length === 0) {
                renderHero(lang);
            }
        }

        function renderHero(lang) {
            chatBox.innerHTML = `
                <div class="welcome-hero" id="welcomeHero">
                    <i class="fas fa-wand-magic-sparkles hero-icon"></i>
                    <h2 class="hero-title">${uiText[lang].heroTitle}</h2>
                    <p class="hero-subtitle">${uiText[lang].heroSub}</p>
                </div>
            `;
        }

        /* --- MANAJEMEN MULTI SESI RIWAYAT (TABEL BUTTON) --- */
        function loadAllSessions() {
            let savedSessions = localStorage.getItem('ai_all_sessions');
            if (savedSessions) {
                allSessions = JSON.parse(savedSessions);
            }

            let sessionKeys = Object.keys(allSessions);
            if (sessionKeys.length === 0) {
                startNewChatSession();
            } else {
                // Urutkan ambil yang paling baru diakses
                sessionKeys.sort((a, b) => allSessions[b].updatedAt - allSessions[a].updatedAt);
                currentSessionId = sessionKeys[0];
                renderHistoryTableList();
                renderCurrentChatMessages();
            }
        }

        function saveAllSessionsToStorage() {
            localStorage.setItem('ai_all_sessions', JSON.stringify(allSessions));
        }

        function startNewChatSession() {
            let id = 'session_' + Date.now();
            allSessions[id] = {
                id: id,
                title: 'Obrolan Kosong',
                messages: [],
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
            currentSessionId = id;
            saveAllSessionsToStorage();
            renderHistoryTableList();
            renderCurrentChatMessages();
            
            if(window.innerWidth < 768) toggleSidebar();
        }

        function selectSession(id) {
            currentSessionId = id;
            renderHistoryTableList();
            renderCurrentChatMessages();
            if(window.innerWidth < 768) toggleSidebar();
        }

        function deleteSessionTable(id, event) {
            event.stopPropagation(); // Biar ga trigger selectSession
            if(confirm("Hapus tabel riwayat obrolan ini?")) {
                delete allSessions[id];
                saveAllSessionsToStorage();
                
                let keys = Object.keys(allSessions);
                if(keys.length === 0) {
                    startNewChatSession();
                } else {
                    if(currentSessionId === id) {
                        currentSessionId = keys[0];
                    }
                    renderHistoryTableList();
                    renderCurrentChatMessages();
                }
            }
        }

        function renderHistoryTableList() {
            historyContainerList.innerHTML = '';
            let keys = Object.keys(allSessions).sort((a, b) => allSessions[b].updatedAt - allSessions[a].updatedAt);
            
            keys.forEach(key => {
                let s = allSessions[key];
                let dateObj = new Date(s.updatedAt);
                let timeStr = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                let activeClass = (key === currentSessionId) ? 'active' : '';

                let itemHTML = `
                    <div class="history-item ${activeClass}" onclick="selectSession('${s.id}')">
                        <div class="history-text-wrapper">
                            <div class="history-item-title">${s.title}</div>
                            <div class="history-item-time">${timeStr}</div>
                        </div>
                        <button class="delete-history-btn" onclick="deleteSessionTable('${s.id}', event)">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
                historyContainerList.innerHTML += itemHTML;
            });
        }

        function renderCurrentChatMessages() {
            chatBox.innerHTML = '';
            let s = allSessions[currentSessionId];
            
            if(!s || s.messages.length === 0) {
                let lang = localStorage.getItem('ai_lang') || 'id';
                renderHero(lang);
                return;
            }

            let lastDateLabel = "";

            s.messages.forEach(msg => {
                // Cetak pembatas hari jika hari berbeda
                if(msg.dayLabel && msg.dayLabel !== lastDateLabel) {
                    let sep = document.createElement('div');
                    sep.className = 'day-separator';
                    sep.innerHTML = `<span>${msg.dayLabel}</span>`;
                    chatBox.appendChild(sep);
                    lastDateLabel = msg.dayLabel;
                }

                appendMessageDOM(msg.text, msg.role === 'user' ? 'user' : 'ai', msg.timeStr, msg.id);
            });
            scrollToBottom();
        }

        /* --- TAMPILAN BALON CHAT & AKSI --- */
        function getDayLabel(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('id-ID', options);
        }

        function appendMessageDOM(text, sender, timeStr, msgId) {
            let wrap = document.createElement('div');
            wrap.className = `message-wrapper ${sender === 'user' ? 'user-wrap' : 'ai-wrap'}`;
            wrap.id = 'msg-wrap-' + msgId;

            let div = document.createElement('div');
            div.className = `message ${sender === 'user' ? 'user-msg' : 'ai-msg'}`;
            div.innerHTML = text.replace(/\n/g, '<br>');
            wrap.appendChild(div);

            // Elemen Jam Terkirim Di Bawah Balon
            let timeDiv = document.createElement('div');
            timeDiv.className = 'msg-timestamp';
            timeDiv.innerText = timeStr;
            wrap.appendChild(timeDiv);

            // Tombol Salin dan Hapus Pesan Individu
            let actionsDiv = document.createElement('div');
            actionsDiv.className = 'msg-actions';
            actionsDiv.innerHTML = `
                <button class="action-btn" onclick="copyMessageText('${msgId}')"><i class="fas fa-copy"></i> Salin</button>
                <button class="action-btn del-msg-btn" onclick="deleteSingleMessage('${msgId}')"><i class="fas fa-trash"></i> Hapus</button>
            `;
            wrap.appendChild(actionsDiv);

            chatBox.appendChild(wrap);
            scrollToBottom();
        }

        function copyMessageText(msgId) {
            let s = allSessions[currentSessionId];
            let msg = s.messages.find(m => m.id === msgId);
            if(msg) {
                navigator.clipboard.writeText(msg.text).then(() => {
                    alert("Pesan berhasil disalin!");
                });
            }
        }

        function deleteSingleMessage(msgId) {
            if(confirm("Hapus pesan ini?")) {
                let s = allSessions[currentSessionId];
                s.messages = s.messages.filter(m => m.id !== msgId);
                
                // Jika setelah dihapus jadi kosong, balikkan title-nya
                if(s.messages.length === 0) {
                    s.title = "Obrolan Kosong";
                }
                
                s.updatedAt = Date.now();
                saveAllSessionsToStorage();
                renderHistoryTableList();
                renderCurrentChatMessages();
            }
        }

        function cekEnter(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                kirimPesan();
            }
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 50);
        }

        /* --- LOGIKA PENGIRIMAN & ENGINE API --- */
        async function kirimPesan() {
            const pesanText = userInput.value.trim();
            if (!pesanText) return;

            const hero = document.getElementById('welcomeHero');
            if (hero) hero.remove();

            let s = allSessions[currentSessionId];
            
            // Set judul tabel berdasarkan isi pesan pertama kali di chat itu
            if(s.messages.length === 0) {
                s.title = pesanText;
            }

            let now = new Date();
            let timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            let dayLabel = getDayLabel(now);
            let userMsgId = 'msg_' + Date.now();

            let newMsgObj = {
                id: userMsgId,
                role: 'user',
                text: pesanText,
                timeStr: timeStr,
                dayLabel: dayLabel
            };

            // Tampilkan tanggal di atas chat jika pesan pertama hari ini
            let lastMsg = s.messages[s.messages.length - 1];
            if(!lastMsg || lastMsg.dayLabel !== dayLabel) {
                let sep = document.createElement('div');
                sep.className = 'day-separator';
                sep.innerHTML = `<span>${dayLabel}</span>`;
                chatBox.appendChild(sep);
            }

            s.messages.push(newMsgObj);
            appendMessageDOM(pesanText, 'user', timeStr, userMsgId);
            userInput.value = '';
            
            s.updatedAt = Date.now();
            saveAllSessionsToStorage();
            renderHistoryTableList();

            // Setup Animasi Loading Tiga Titik
            const typingId = 'typing-' + Date.now();
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = typingId;
            typingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            chatBox.appendChild(typingDiv);
            scrollToBottom();

            // Mapping format memori riwayat untuk payload API Gemini
            let apiContents = s.messages.map(msg => ({
                role: msg.role === 'user' ? 'user' : 'model',
                parts: [{ text: msg.text }]
            }));

            let userName = localStorage.getItem('ai_userName') || 'Teman';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ 
                                text: `Kamu adalah asisten AI yang sangat pintar, ramah, hangat, dan penuh empati. Namamu adalah AI Asisten. Nama pengguna yang sedang mengobrol denganmu adalah "${userName}". Jawablah pertanyaannya dengan cara yang paling membantu, suportif, dan senatural mungkin layaknya sahabat yang cerdas. Gunakan bahasa yang sesuai dengan yang digunakan pengguna.`
                            }]
                        },
                        contents: apiContents
                    })
                });

                const data = await response.json();
                
                const elementTyping = document.getElementById(typingId);
                if(elementTyping) elementTyping.remove();

                if(data.error) {
                    throw new Error(data.error.message);
                }

                const jawabanAI = data.candidates[0].content.parts[0].text;
                let aiTime = new Date();
                let aiTimeStr = aiTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                let aiMsgId = 'msg_' + Date.now() + '_ai';

                let aiMsgObj = {
                    id: aiMsgId,
                    role: 'model',
                    text: jawabanAI,
                    timeStr: aiTimeStr,
                    dayLabel: dayLabel
                };

                s.messages.push(aiMsgObj);
                appendMessageDOM(jawabanAI, 'ai', aiTimeStr, aiMsgId);
                
                s.updatedAt = Date.now();
                saveAllSessionsToStorage();
                renderHistoryTableList();

            } catch (error) {
                const elementTyping = document.getElementById(typingId);
                if(elementTyping) elementTyping.remove();
                
                let errId = 'err_' + Date.now();
                appendMessageDOM("Gagal terhubung ke AI. Silakan periksa kembali konfigurasi atau koneksi internet.", 'ai', timeStr, errId);
                console.error(error);
            }
        }
    </script>
</body>
